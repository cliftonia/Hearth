name: Hearth
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HearthKit:
    path: HearthKit
targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HearthKit
        product: HearthUI
      - target: HearthWidgets
      # The Mac has its own ways to hand things to an app, so the share extension is for iPhone and iPad.
      - target: HearthShare
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEARTH_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HEARTH_DEVELOPMENT_TEAM)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        # The same app runs on the Mac through Mac Catalyst.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Only the Mac build carries these; iPhone and iPad ask for the microphone through Info.plist alone.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/HearthMac.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": App/Hearth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The widgets open the app through this scheme: hearth://new and hearth://voice.
        CFBundleURLTypes:
          - CFBundleURLName: $(HEARTH_BUNDLE_ID)
            CFBundleURLSchemes:
              - hearth
        NSFaceIDUsageDescription: Hearth uses Face ID to unlock your conversations.
        NSPhotoLibraryAddUsageDescription: Hearth saves a picture to your photo library when you ask it to.
        NSCameraUsageDescription: Hearth uses the camera when you take a photo to attach to a message.
        NSMicrophoneUsageDescription: Hearth listens when you dictate a message or hold a voice conversation.
        NSSpeechRecognitionUsageDescription: Hearth turns what you say into text for your message.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        HearthDefaultOllamaAddress: $(HEARTH_OLLAMA_ADDRESS)
        HearthDefaultSearchAddress: $(HEARTH_SEARCH_ADDRESS)
        HearthDefaultSpeechAddress: $(HEARTH_SPEECH_ADDRESS)
        HearthDefaultImageAddress: $(HEARTH_IMAGE_ADDRESS)
        HearthDefaultModel: $(HEARTH_DEFAULT_MODEL)
        HearthAppGroup: $(HEARTH_APP_GROUP)
  # Home screen and lock screen shortcuts to a new chat and to a voice conversation.
  HearthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEARTH_BUNDLE_ID).widgets
        DEVELOPMENT_TEAM: $(HEARTH_DEVELOPMENT_TEAM)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # "Hearth" in the share sheet: hands text, links, pictures and files to the app.
  HearthShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEARTH_BUNDLE_ID).share
        DEVELOPMENT_TEAM: $(HEARTH_DEVELOPMENT_TEAM)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Share/HearthShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        HearthAppGroup: $(HEARTH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 6
              NSExtensionActivationSupportsFileWithMaxCount: 6
schemes:
  Hearth:
    build:
      targets:
        Hearth: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HearthKit/HearthDataTests
        - package: HearthKit/HearthDomainTests
        - package: HearthKit/HearthUITests
