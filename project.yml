name: Hearth
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HearthKit:
    path: HearthKit
targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HearthKit
        product: HearthUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEARTH_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HEARTH_DEVELOPMENT_TEAM)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Hearth listens when you dictate a message or hold a voice conversation.
        NSSpeechRecognitionUsageDescription: Hearth turns what you say into text for your message.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        HearthDefaultOllamaAddress: $(HEARTH_OLLAMA_ADDRESS)
        HearthDefaultSearchAddress: $(HEARTH_SEARCH_ADDRESS)
        HearthDefaultSpeechAddress: $(HEARTH_SPEECH_ADDRESS)
schemes:
  Hearth:
    build:
      targets:
        Hearth: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HearthKit/HearthDataTests
        - package: HearthKit/HearthDomainTests
